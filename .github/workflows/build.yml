name: build-band11

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-dtc
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-bzip2

      - name: Fetch vendor and firmware from upstream
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/DDlhy/Miband-qemu-simulator.git upstream
          Copy-Item upstream\vendor .\vendor -Recurse -Force
          Copy-Item upstream\firmware .\firmware -Recurse -Force

      - name: Build band11 QEMU
        shell: powershell
        run: .\build.cmd -Toolchain C:\msys64 -Model band11 -Jobs 4

      - name: Download runtime inputs
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip" -OutFile "$env:RUNNER_TEMP\python-embed.zip"
          python -m pip download --only-binary=:all: --no-deps --platform win_amd64 --python-version 311 --implementation cp --abi cp311 littlefs-python==0.19.0 -d "$env:RUNNER_TEMP\inputs"
          Get-ChildItem "$env:RUNNER_TEMP\inputs"

      - name: Assemble runtime directory
        shell: powershell
        run: |
          $wheel = (Get-ChildItem "$env:RUNNER_TEMP\inputs\*.whl" | Select-Object -First 1).FullName
          python -B tools\assemble_runtime.py --toolchain C:\msys64 --model band11 `
            --build-root .build `
            --python-embed "$env:RUNNER_TEMP\python-embed.zip" `
            --littlefs-wheel $wheel `
            --output dist\miband11-runtime

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: miband11-runtime
          path: dist/miband11-runtime
          retention-days: 14

      - name: Upload qemu exe (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: band11-qemu-exe
          path: .build/band11/build/qemu-system-arm.exe
          retention-days: 14
